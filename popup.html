<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>QB Overhead Fee</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;width:280px;background:#f7f8fa;color:#1a1a2e;font-size:13px}
    .header{background:linear-gradient(135deg,#0077c5,#005999);color:white;padding:14px 16px 12px;display:flex;align-items:center;gap:10px}
    .header-icon{width:32px;height:32px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex-shrink:0}
    .header-title{font-size:14px;font-weight:700}
    .header-sub{font-size:11px;opacity:.8;margin-top:2px}
    .status-bar{padding:10px 16px;border-bottom:1px solid #e0e4ea;background:white;display:flex;align-items:center;gap:8px}
    .status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transition:background .3s}
    .status-dot.active{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2)}
    .status-dot.inactive{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.2)}
    .status-text{font-size:12px;font-weight:600}
    .status-text.active{color:#15803d}.status-text.inactive{color:#dc2626}
    .status-detail{font-size:11px;color:#6b7280;margin-left:auto}
    .section{padding:14px 16px;background:white;margin-top:6px}
    .section-label{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
    .percent-row{display:flex;align-items:center;gap:10px}
    .percent-input-wrap{position:relative;flex:1}
    .percent-input{width:100%;padding:8px 28px 8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:15px;font-weight:700;color:#0077c5;outline:none;-moz-appearance:textfield}
    .percent-input::-webkit-inner-spin-button,.percent-input::-webkit-outer-spin-button{-webkit-appearance:none}
    .percent-input:focus{border-color:#0077c5;box-shadow:0 0 0 2px rgba(0,119,197,.15)}
    .percent-sign{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:700;color:#6b7280;pointer-events:none}
    .save-btn{padding:8px 16px;background:#0077c5;color:white;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
    .save-btn:hover{background:#005999}.save-btn:active{background:#004d80}.save-btn.saved{background:#22c55e}
    .hint-box{background:#f0f6ff;border:1px solid #bfdbfe;border-radius:6px;padding:10px 12px;font-size:11.5px;color:#1e40af;line-height:1.5;margin-top:10px}
    .hint-box strong{display:block;margin-bottom:3px;font-size:12px}
    .footer{padding:10px 16px;text-align:center;font-size:10px;color:#9ca3af;border-top:1px solid #e5e7eb;margin-top:6px}
  </style>
</head>
<body>
  <div class="header">
    <div class="header-icon">%</div>
    <div><div class="header-title">QB Overhead Fee</div><div class="header-sub">QuickBooks Invoice Add-on</div></div>
  </div>
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">Checking...</span>
    <span class="status-detail" id="statusDetail"></span>
  </div>
  <div class="section">
    <div class="section-label">Overhead Percentage</div>
    <div class="percent-row">
      <div class="percent-input-wrap">
        <input type="number" id="percentInput" class="percent-input" value="20" min="0.1" max="9999" step="0.1"/>
        <span class="percent-sign">%</span>
      </div>
      <button class="save-btn" id="saveBtn">Save</button>
    </div>
    <div class="hint-box">
      <strong>How to use:</strong>
      Click <em>"Add Overhead (X%)"</em> on the last empty row. Description, Rate, and Amount all fill in automatically. Button hides until you delete the overhead row.
    </div>
  </div>
  <div class="footer">Only active on qbo.intuit.com/app/invoice</div>
  <script src="popup.js"></script>
</body>
</html>
